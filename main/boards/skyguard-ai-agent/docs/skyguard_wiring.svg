<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" font-family="monospace" font-size="11">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f44"/>
    </marker>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4"/>
    </marker>
    <marker id="arr-blu" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#48f"/>
    </marker>
    <marker id="arr-ylw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fa0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="950" fill="#1a1a2e" rx="12"/>
  <text x="700" y="32" text-anchor="middle" fill="#55aaff" font-size="18" font-weight="bold">SkyGuard Elite AI — Cablaggio Connettori → Basette Sensori</text>
  <text x="700" y="52" text-anchor="middle" fill="#556" font-size="10">LCDWiki 2.8" ESP32-S3 — 2x JST 1.25mm 4-pin → 2x Basette Multiforo</text>

  <!-- ============ LCDWIKI MAIN BOARD (CENTER) ============ -->
  <rect x="430" y="80" width="540" height="380" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="430" y="80" width="540" height="30" rx="10" fill="#1a3366"/>
  <text x="700" y="100" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">LCDWiki 2.8" ESP32-S3 Display Board</text>

  <!-- Display area -->
  <rect x="520" y="125" width="360" height="200" rx="6" fill="#0a0a1a" stroke="#334" stroke-width="1"/>
  <text x="700" y="195" text-anchor="middle" fill="#223" font-size="28">ILI9341</text>
  <text x="700" y="220" text-anchor="middle" fill="#223" font-size="12">320x240 TFT + FT6336G Touch</text>
  <text x="700" y="240" text-anchor="middle" fill="#223" font-size="9">SPI2 (GPIO 10,11,12,13,46) | BL: GPIO45</text>

  <!-- On-board components -->
  <g font-size="9" fill="#667">
    <text x="530" y="345">On-board: ES8311(0x18) + MEMS Mic + FM8002E PA</text>
    <text x="530" y="360">I2S: MCLK=4, BCLK=5, WS=7, DOUT=8, DIN=6 | PA=GPIO1</text>
    <text x="530" y="375">SD Card SDIO: CLK=38, CMD=40, D0-3=39,41,48,47</text>
    <text x="530" y="390">WS2812 RGB LED: GPIO42 | Battery ADC: GPIO9</text>
    <text x="530" y="405">USB Serial: TX=43, RX=44 | BOOT: GPIO0</text>
  </g>

  <!-- ============ I2C CONNECTOR (LEFT SIDE OF BOARD) ============ -->
  <rect x="435" y="420" width="130" height="35" rx="4" fill="#1a0a1a" stroke="#c6f" stroke-width="1.5"/>
  <text x="500" y="432" text-anchor="middle" fill="#c6f" font-size="8" font-weight="bold">I2C CONNECTOR</text>
  <text x="500" y="447" text-anchor="middle" fill="#96a" font-size="7">JST 1.25mm 4-pin</text>

  <!-- I2C connector pins detail -->
  <rect x="380" y="465" width="240" height="80" rx="6" fill="#111" stroke="#c6f" stroke-width="1"/>
  <g font-size="9">
    <rect x="392" y="474" width="8" height="8" rx="1" fill="#f44"/> <text x="406" y="482" fill="#f88">Pin 1: VCC (3.3V)</text>
    <rect x="392" y="490" width="8" height="8" rx="1" fill="#444"/> <text x="406" y="498" fill="#888">Pin 2: GND</text>
    <rect x="392" y="506" width="8" height="8" rx="1" fill="#c6f"/> <text x="406" y="514" fill="#96a">Pin 3: GPIO15 (SCL) — I2C_NUM_0</text>
    <rect x="392" y="522" width="8" height="8" rx="1" fill="#c6f"/> <text x="406" y="530" fill="#96a">Pin 4: GPIO16 (SDA) — I2C_NUM_0</text>
  </g>

  <!-- ============ EXP CONNECTOR (LEFT SIDE OF BOARD) ============ -->
  <rect x="585" y="420" width="130" height="35" rx="4" fill="#0a1a1a" stroke="#0cf" stroke-width="1.5"/>
  <text x="650" y="432" text-anchor="middle" fill="#0cf" font-size="8" font-weight="bold">EXP CONNECTOR</text>
  <text x="650" y="447" text-anchor="middle" fill="#089" font-size="7">JST 1.25mm 4-pin</text>

  <!-- EXP connector pins detail -->
  <rect x="530" y="465" width="240" height="80" rx="6" fill="#111" stroke="#0cf" stroke-width="1"/>
  <g font-size="9">
    <rect x="542" y="474" width="8" height="8" rx="1" fill="#4c4"/> <text x="556" y="482" fill="#8c8">Pin 1: GPIO2  — UART1 RX (da GPS TX)</text>
    <rect x="542" y="490" width="8" height="8" rx="1" fill="#4c4"/> <text x="556" y="498" fill="#8c8">Pin 2: GPIO3  — UART1 TX (a GPS RX)</text>
    <rect x="542" y="506" width="8" height="8" rx="1" fill="#fa0"/> <text x="556" y="514" fill="#ca0">Pin 3: GPIO14 — I2C_NUM_1 SDA (sensori)</text>
    <rect x="542" y="522" width="8" height="8" rx="1" fill="#fa0"/> <text x="556" y="530" fill="#ca0">Pin 4: GPIO21 — I2C_NUM_1 SCL (sensori)</text>
  </g>

  <!-- IMPORTANT NOTE -->
  <rect x="785" y="465" width="180" height="80" rx="6" fill="#2a0a0a" stroke="#f44" stroke-width="1"/>
  <text x="875" y="483" text-anchor="middle" fill="#f66" font-size="9" font-weight="bold">ATTENZIONE</text>
  <text x="875" y="498" text-anchor="middle" fill="#f44" font-size="8">EXP non ha VCC/GND!</text>
  <text x="875" y="513" text-anchor="middle" fill="#f44" font-size="8">Alimentazione sensori</text>
  <text x="875" y="528" text-anchor="middle" fill="#f44" font-size="8">da I2C connector</text>
  <text x="875" y="543" text-anchor="middle" fill="#f44" font-size="8">VCC + GND</text>

  <!-- ============ BASETTA A — ZENITH (TOP LEFT) ============ -->
  <rect x="30" y="580" width="380" height="330" rx="8" fill="#0a1a0a" stroke="#fa0" stroke-width="2"/>
  <rect x="30" y="580" width="380" height="28" rx="8" fill="#2a1a00"/>
  <text x="220" y="598" text-anchor="middle" fill="#fa0" font-size="13" font-weight="bold">BASETTA A — ZENITH (punta al cielo)</text>

  <!-- Perfboard visual -->
  <rect x="50" y="620" width="340" height="100" rx="4" fill="#1a2a1a" stroke="#3a5a3a" stroke-width="1"/>
  <text x="220" y="636" text-anchor="middle" fill="#5a8a5a" font-size="8">Basetta multiforo lunga e stretta</text>

  <!-- TSL2591 chip -->
  <rect x="70" y="650" width="120" height="55" rx="4" fill="#0a0a1a" stroke="#29f" stroke-width="1.5"/>
  <text x="130" y="668" text-anchor="middle" fill="#29f" font-size="10" font-weight="bold">TSL2591</text>
  <text x="130" y="682" text-anchor="middle" fill="#29f" font-size="8">Lux / MPSAS</text>
  <text x="130" y="696" text-anchor="middle" fill="#268" font-size="8">I2C 0x29</text>

  <!-- AS7341 chip -->
  <rect x="210" y="650" width="120" height="55" rx="4" fill="#0a0a1a" stroke="#f90" stroke-width="1.5"/>
  <text x="270" y="668" text-anchor="middle" fill="#f90" font-size="10" font-weight="bold">AS7341</text>
  <text x="270" y="682" text-anchor="middle" fill="#f90" font-size="8">Spectral 8-ch</text>
  <text x="270" y="696" text-anchor="middle" fill="#a60" font-size="8">I2C 0x39</text>

  <!-- Basetta A pin connections -->
  <g font-size="9">
    <text x="55" y="745" fill="#f88">VCC (3.3V) ← I2C conn pin 1</text>
    <text x="55" y="762" fill="#888">GND       ← I2C conn pin 2</text>
    <text x="55" y="779" fill="#ca0">SDA (dati) ← EXP conn GPIO14</text>
    <text x="55" y="796" fill="#ca0">SCL (clock) ← EXP conn GPIO21</text>
  </g>

  <!-- Wire routing basetta A -->
  <text x="55" y="825" fill="#5a8a5a" font-size="9" font-weight="bold">Cablaggio (4 fili):</text>
  <g font-size="8" fill="#5a8a5a">
    <text x="55" y="842">Rosso: VCC → pin VCC TSL2591 → ponte → VCC AS7341</text>
    <text x="55" y="856">Nero:  GND → pin GND TSL2591 → ponte → GND AS7341</text>
    <text x="55" y="870">Giallo: SDA → pin SDA TSL2591 → ponte → SDA AS7341</text>
    <text x="55" y="884">Arancio: SCL → pin SCL TSL2591 → ponte → SCL AS7341</text>
  </g>
  <text x="55" y="902" fill="#556" font-size="8">Bus I2C_NUM_1 @ 100kHz — pullup interni 45k sufficienti</text>

  <!-- ============ BASETTA B — NEAR (TOP RIGHT) ============ -->
  <rect x="990" y="580" width="380" height="330" rx="8" fill="#0a0a1a" stroke="#0cf" stroke-width="2"/>
  <rect x="990" y="580" width="380" height="28" rx="8" fill="#001a2a"/>
  <text x="1180" y="598" text-anchor="middle" fill="#0cf" font-size="13" font-weight="bold">BASETTA B — NEAR (vicino board)</text>

  <!-- Perfboard visual -->
  <rect x="1010" y="620" width="340" height="100" rx="4" fill="#1a1a2a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="1180" y="636" text-anchor="middle" fill="#5a5a8a" font-size="8">Basetta multiforo lunga e stretta</text>

  <!-- AHT20 chip -->
  <rect x="1030" y="650" width="120" height="55" rx="4" fill="#0a0a1a" stroke="#4cf" stroke-width="1.5"/>
  <text x="1090" y="668" text-anchor="middle" fill="#4cf" font-size="10" font-weight="bold">AHT20</text>
  <text x="1090" y="682" text-anchor="middle" fill="#4cf" font-size="8">Temp / Humidity</text>
  <text x="1090" y="696" text-anchor="middle" fill="#289" font-size="8">I2C 0x38</text>

  <!-- GPS chip -->
  <rect x="1170" y="650" width="120" height="55" rx="4" fill="#0a0a1a" stroke="#4c4" stroke-width="1.5"/>
  <text x="1230" y="668" text-anchor="middle" fill="#4c4" font-size="10" font-weight="bold">GPS</text>
  <text x="1230" y="682" text-anchor="middle" fill="#4c4" font-size="8">NMEA 9600</text>
  <text x="1230" y="696" text-anchor="middle" fill="#264" font-size="8">UART1</text>

  <!-- Basetta B pin connections -->
  <g font-size="9">
    <text x="1015" y="745" fill="#f88">VCC (3.3V) ← I2C conn pin 1</text>
    <text x="1015" y="762" fill="#888">GND       ← I2C conn pin 2</text>
    <text x="1015" y="779" fill="#ca0">SDA (dati) ← EXP conn GPIO14</text>
    <text x="1015" y="796" fill="#ca0">SCL (clock) ← EXP conn GPIO21</text>
    <text x="1015" y="813" fill="#8c8">GPS TX→RX  ← EXP conn GPIO2</text>
    <text x="1015" y="830" fill="#8c8">GPS RX←TX  ← EXP conn GPIO3</text>
  </g>

  <!-- Wire routing basetta B -->
  <text x="1015" y="855" fill="#5a5a8a" font-size="9" font-weight="bold">Cablaggio (6 fili):</text>
  <g font-size="8" fill="#5a5a8a">
    <text x="1015" y="872">Rosso:   VCC → VCC AHT20 → ponte → VCC GPS</text>
    <text x="1015" y="886">Nero:    GND → GND AHT20 → ponte → GND GPS</text>
    <text x="1015" y="900">Giallo:  SDA → SDA AHT20 (solo, GPS no I2C)</text>
  </g>

  <!-- ============ WIRE ROUTING DIAGRAM (CENTER) ============ -->
  <rect x="440" y="570" width="520" height="340" rx="8" fill="#111119" stroke="#334" stroke-width="1"/>
  <text x="700" y="590" text-anchor="middle" fill="#aaa" font-size="12" font-weight="bold">Schema Cablaggio Fili</text>

  <!-- FROM I2C CONNECTOR -->
  <text x="460" y="615" fill="#c6f" font-size="10" font-weight="bold">Da I2C Connector:</text>
  <!-- VCC wire -->
  <line x1="460" y1="625" x2="460" y2="640" stroke="#f44" stroke-width="2"/>
  <line x1="460" y1="640" x2="200" y2="640" stroke="#f44" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-red)"/>
  <text x="465" y="638" fill="#f88" font-size="8">VCC (rosso)</text>

  <line x1="530" y1="625" x2="530" y2="655" stroke="#f44" stroke-width="2"/>
  <line x1="530" y1="655" x2="1200" y2="655" stroke="#f44" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-red)"/>

  <!-- GND wire -->
  <line x1="460" y1="660" x2="460" y2="675" stroke="#666" stroke-width="2"/>
  <line x1="460" y1="675" x2="200" y2="675" stroke="#666" stroke-width="2" stroke-dasharray="8,3"/>
  <text x="465" y="673" fill="#888" font-size="8">GND (nero)</text>

  <line x1="530" y1="660" x2="530" y2="690" stroke="#666" stroke-width="2"/>
  <line x1="530" y1="690" x2="1200" y2="690" stroke="#666" stroke-width="2" stroke-dasharray="8,3"/>

  <!-- FROM EXP CONNECTOR -->
  <text x="460" y="718" fill="#0cf" font-size="10" font-weight="bold">Da EXP Connector:</text>

  <!-- I2C SDA wire (GPIO14) -->
  <line x1="460" y1="728" x2="460" y2="743" stroke="#fa0" stroke-width="2"/>
  <line x1="460" y1="743" x2="200" y2="743" stroke="#fa0" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-ylw)"/>
  <text x="465" y="741" fill="#ca0" font-size="8">GPIO14 SDA (giallo)</text>

  <line x1="530" y1="728" x2="530" y2="758" stroke="#fa0" stroke-width="2"/>
  <line x1="530" y1="758" x2="1200" y2="758" stroke="#fa0" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-ylw)"/>

  <!-- I2C SCL wire (GPIO21) -->
  <line x1="460" y1="763" x2="460" y2="778" stroke="#fa0" stroke-width="2"/>
  <line x1="460" y1="778" x2="200" y2="778" stroke="#fa0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-ylw)"/>
  <text x="465" y="776" fill="#ca0" font-size="8">GPIO21 SCL (arancio)</text>

  <line x1="530" y1="763" x2="530" y2="793" stroke="#fa0" stroke-width="2"/>
  <line x1="530" y1="793" x2="1200" y2="793" stroke="#fa0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-ylw)"/>

  <!-- GPS UART wires (only to Basetta B) -->
  <line x1="620" y1="810" x2="620" y2="828" stroke="#4c4" stroke-width="2"/>
  <line x1="620" y1="828" x2="1200" y2="828" stroke="#4c4" stroke-width="2" stroke-dasharray="8,3" marker-end="url(#arr-grn)"/>
  <text x="625" y="825" fill="#8c8" font-size="8">GPIO2 RX (verde) — solo Basetta B</text>

  <line x1="620" y1="845" x2="620" y2="858" stroke="#4c4" stroke-width="2"/>
  <line x1="620" y1="858" x2="1200" y2="858" stroke="#4c4" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-grn)"/>
  <text x="625" y="855" fill="#8c8" font-size="8">GPIO3 TX (verde ch.) — solo Basetta B</text>

  <!-- Labels on wire ends -->
  <text x="200" y="633" fill="#fa0" font-size="8" text-anchor="end">← Basetta A</text>
  <text x="1200" y="648" fill="#0cf" font-size="8">Basetta B →</text>

  <!-- Summary box -->
  <rect x="460" y="872" width="480" height="68" rx="6" fill="#0d1117" stroke="#334" stroke-width="1"/>
  <text x="700" y="890" text-anchor="middle" fill="#ff6" font-size="10" font-weight="bold">Riepilogo Fili</text>
  <g font-size="9">
    <text x="480" y="908" fill="#fa0">Basetta A (zenith): 4 fili</text>
    <text x="480" y="923" fill="#8a8">VCC, GND, SDA(GPIO14), SCL(GPIO21)</text>
    <text x="750" y="908" fill="#0cf">Basetta B (near): 6 fili</text>
    <text x="750" y="923" fill="#8a8">VCC, GND, SDA(GPIO14), SCL(GPIO21), RX(GPIO2), TX(GPIO3)</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="980" y="80" width="390" height="200" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="1175" y="100" text-anchor="middle" fill="#aaa" font-size="11" font-weight="bold">Legenda Colori Fili</text>
  <g font-size="9">
    <line x1="1000" y1="118" x2="1040" y2="118" stroke="#f44" stroke-width="3"/> <text x="1050" y="122" fill="#f88">Rosso — VCC 3.3V (da I2C conn)</text>
    <line x1="1000" y1="138" x2="1040" y2="138" stroke="#666" stroke-width="3"/> <text x="1050" y="142" fill="#888">Nero — GND (da I2C conn)</text>
    <line x1="1000" y1="158" x2="1040" y2="158" stroke="#fa0" stroke-width="3"/> <text x="1050" y="162" fill="#ca0">Giallo — I2C SDA GPIO14 (da EXP conn)</text>
    <line x1="1000" y1="178" x2="1040" y2="178" stroke="#fa0" stroke-width="3" stroke-dasharray="6,3"/> <text x="1050" y="182" fill="#ca0">Arancio — I2C SCL GPIO21 (da EXP conn)</text>
    <line x1="1000" y1="198" x2="1040" y2="198" stroke="#4c4" stroke-width="3"/> <text x="1050" y="202" fill="#8c8">Verde — UART1 RX GPIO2 (da EXP conn)</text>
    <line x1="1000" y1="218" x2="1040" y2="218" stroke="#4c4" stroke-width="3" stroke-dasharray="6,3"/> <text x="1050" y="222" fill="#8c8">Verde ch. — UART1 TX GPIO3 (da EXP conn)</text>
    <text x="1000" y="248" fill="#f66" font-size="8">I2C bus condiviso: TSL2591 + AS7341 + AHT20</text>
    <text x="1000" y="263" fill="#f66" font-size="8">Tutti su I2C_NUM_1 @ 100kHz (indirizzi diversi)</text>
  </g>

  <!-- I2C address note -->
  <rect x="980" y="290" width="390" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="1175" y="310" text-anchor="middle" fill="#aaa" font-size="11" font-weight="bold">Indirizzi I2C_NUM_1 (bus sensori)</text>
  <g font-size="10">
    <rect x="1000" y="325" width="12" height="12" rx="2" fill="#29f"/> <text x="1020" y="336" fill="#29f">0x29 — TSL2591 (lux/SQM)</text>
    <rect x="1000" y="345" width="12" height="12" rx="2" fill="#f90"/> <text x="1020" y="356" fill="#f90">0x39 — AS7341 (spettrale)</text>
    <rect x="1000" y="365" width="12" height="12" rx="2" fill="#4cf"/> <text x="1020" y="376" fill="#4cf">0x38 — AHT20 (temp/hum)</text>
    <rect x="1000" y="385" width="12" height="12" rx="2" fill="#c6f"/> <text x="1020" y="396" fill="#c6f">0x18 — ES8311 (audio, bus 0)</text>
    <rect x="1000" y="405" width="12" height="12" rx="2" fill="#c6f"/> <text x="1020" y="416" fill="#c6f">0x38 — FT6336G (touch, bus 0)</text>
    <text x="1000" y="440" fill="#f44" font-size="8">AHT20 (0x38) e FT6336G (0x38) su bus DIVERSI!</text>
  </g>

  <!-- Footer -->
  <text x="700" y="942" text-anchor="middle" fill="#556" font-size="9">SkyGuard Elite AI — xamad/aiChatbot — 2026</text>
</svg>